name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Triggered on tags like v1.0.0, v2.3.1, etc.
    branches:
      - develop       # Run validation on every push to develop
  pull_request:       # Run validation on every PR
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write    # Required to create releases and upload assets

# Run all JavaScript actions on Node.js 24 (checkout/setup-node/artifact actions
# ship a Node20 runtime that GitHub deprecates — this opts in early, no warnings).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate (type-check + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        # postinstall rebuilds better-sqlite3 against Electron's ABI…

      - name: Rebuild native modules for the Node ABI
        # …but Vitest runs under plain Node, so rebuild better-sqlite3 against the
        # Node ABI before the test step (otherwise NODE_MODULE_VERSION mismatches).
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Type-check
        run: yarn type-check

      - name: Test
        run: yarn test

  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install
        # postinstall script rebuilds better-sqlite3 natively for macOS

      - name: Cache AI model
        uses: actions/cache@v4
        with:
          path: src/renderer/public/models
          key: model-${{ hashFiles('scripts/download-model.mjs') }}

      - name: Download AI model
        run: yarn download-model

      - name: Build & package
        # --publish never: electron-builder only builds; the "release" job below is
        # the single publisher (avoids duplicate, differently-named release assets).
        # To sign & notarize, add Apple creds as GitHub Secrets and pass them as env:
        # CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
        run: yarn dist:mac --publish never

      - name: Ad-hoc codesign (prevents "app is damaged" on Apple Silicon)
        run: |
          APP_PATH=$(find release/mac* -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing: $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH"
            echo "Ad-hoc signature applied successfully"
          else
            echo "Warning: No .app found to sign"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleManager-mac
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install
        # postinstall script rebuilds better-sqlite3 natively for Windows

      - name: Cache AI model
        uses: actions/cache@v4
        with:
          path: src/renderer/public/models
          key: model-${{ hashFiles('scripts/download-model.mjs') }}

      - name: Download AI model
        run: yarn download-model

      - name: Build & package
        # --publish never: build only; the "release" job is the single publisher.
        # To sign, add Windows creds as GitHub Secrets and pass CSC_LINK / CSC_KEY_PASSWORD as env.
        run: yarn dist:win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleManager-win
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install
        # postinstall script rebuilds better-sqlite3 natively for Linux

      - name: Cache AI model
        uses: actions/cache@v4
        with:
          path: src/renderer/public/models
          key: model-${{ hashFiles('scripts/download-model.mjs') }}

      - name: Download AI model
        run: yarn download-model

      - name: Build & package
        # --publish never: build only; the "release" job is the single publisher.
        run: yarn dist:linux --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleManager-linux
          path: release/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KindleManager-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KindleManager-win
          path: artifacts/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KindleManager-linux
          path: artifacts/linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
            artifacts/linux/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
