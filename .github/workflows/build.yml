name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Triggered on tags like v1.0.0, v2.3.1, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write    # Required to create releases and upload assets

jobs:
  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install
        # postinstall script rebuilds better-sqlite3 natively for macOS

      - name: Download AI model
        run: yarn download-model

      - name: Build & package
        run: yarn dist:mac
        env:
          # Optional: Add Apple signing credentials as GitHub Secrets to sign & notarize
          # CSC_LINK: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ad-hoc codesign (prevents "app is damaged" on Apple Silicon)
        run: |
          APP_PATH=$(find release/mac* -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing: $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH"
            echo "Ad-hoc signature applied successfully"
          else
            echo "Warning: No .app found to sign"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleManager-mac
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install
        # postinstall script rebuilds better-sqlite3 natively for Windows

      - name: Download AI model
        run: yarn download-model

      - name: Build & package
        run: yarn dist:win
        env:
          # Optional: Add Windows code signing credentials as GitHub Secrets
          # CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindleManager-win
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KindleManager-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KindleManager-win
          path: artifacts/win

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
